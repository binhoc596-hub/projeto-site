<!DOCTYPE html><html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avaliações - Loja de Informática</title>
  <style>
    body {font-family: Arial, sans-serif; background:#0f172a; color:#fff; margin:0; display:flex; justify-content:center; align-items:center; min-height:100vh;}
    .container {background:#1e293b; padding:20px; border-radius:15px; width:360px; box-shadow:0 0 20px rgba(0,0,0,0.5);} 
    h1 {text-align:center; margin:10px 0;}
    .logo {text-align:center; font-size:20px; font-weight:bold;}
    .stars {display:flex; justify-content:center; margin:10px 0;}
    .star {font-size:30px; cursor:pointer; color:gray;}
    .star.active {color:gold;}
    input, textarea {width:100%; border:none; border-radius:10px; padding:10px; margin-top:8px;}
    textarea {height:80px; resize:none;}
    button {width:100%; margin-top:10px; padding:10px; border:none; border-radius:10px; background:#22c55e; color:#fff; font-size:16px; cursor:pointer;}
    .reviews {margin-top:15px; max-height:180px; overflow-y:auto;}
    .review {background:#334155; padding:8px; border-radius:10px; margin-bottom:5px;}
    .avg {text-align:center; margin-top:10px; font-size:14px;}
    .whatsapp {display:block; text-align:center; margin-top:10px; text-decoration:none; background:#25d366; padding:10px; border-radius:10px; color:#fff;}
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">💻 Sua Loja de Informática</div>
    <h1>Avalie nosso serviço</h1><div class="stars" id="stars">
  <span class="star">★</span>
  <span class="star">★</span>
  <span class="star">★</span>
  <span class="star">★</span>
  <span class="star">★</span>
</div>

<input id="name" placeholder="Seu nome (opcional)">
<textarea id="comment" placeholder="Deixe seu comentário..."></textarea>
<button onclick="submitReview()">Enviar Avaliação</button>

<div class="avg" id="avg"></div>
<div class="reviews" id="reviews"></div>

<a class="whatsapp" href="https://wa.me/5571999999999" target="_blank">Falar no WhatsApp</a>

  </div>  <script>
    let rating = 0;
    const stars = document.querySelectorAll('.star');
    let reviews = JSON.parse(localStorage.getItem('reviews')) || [];

    stars.forEach((star, index) => {
      star.addEventListener('click', () => {
        rating = index + 1;
        updateStars();
      });
    });

    function updateStars() {
      stars.forEach((star, index) => {
        star.classList.toggle('active', index < rating);
      });
    }

    function renderReviews() {
      const container = document.getElementById('reviews');
      container.innerHTML = '';
      let total = 0;

      reviews.forEach(r => {
        total += r.rating;
        const div = document.createElement('div');
        div.classList.add('review');
        div.innerHTML = `<b>${r.name || 'Cliente'}</b><br>⭐ ${r.rating}/5<br>${r.comment}`;
        container.appendChild(div);
      });

      const avg = reviews.length ? (total / reviews.length).toFixed(1) : 0;
      document.getElementById('avg').innerText = `Média: ${avg} ⭐ (${reviews.length} avaliações)`;
    }

    function submitReview() {
      const name = document.getElementById('name').value;
      const comment = document.getElementById('comment').value;

      if (rating === 0 || comment === '') {
        alert('Dê uma nota e escreva um comentário.');
        return;
      }

      const newReview = { name, comment, rating };
      reviews.unshift(newReview);
      localStorage.setItem('reviews', JSON.stringify(reviews));

      document.getElementById('name').value = '';
      document.getElementById('comment').value = '';
      rating = 0;
      updateStars();
      renderReviews();
    }

    renderReviews();
  </script></body>
</html>
